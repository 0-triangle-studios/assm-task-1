<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="imgcarousel.css">
  <title></title>
</head>

<body>
  <header></header>
  <main>
    <div class="rootcarousel">
      <!-- Controls -->
      <input type="radio" name="slide" id="slide1" checked>
      <input type="radio" name="slide" id="slide2">
      <input type="radio" name="slide" id="slide3">
      <input type="radio" name="slide" id="slide4">

      <!-- Slides -->
      <div class="slide slide1"><img src="gameplaydefault.svg"></div>
      <div class="slide slide2">Image 2 Content</div>
      <div class="slide slide3">Image 3 Content</div>
      <div class="slide slide4"><img src="gameplaydefault_2.svg"></div>

      <!-- Navigation Buttons -->
      <div class="imgbtn">
        <label for="slide1" class="btn"></label>
        <label for="slide2" class="btn"></label>
        <label for="slide3" class="btn"></label>
        <label for="slide4" class="btn"></label>
      </div>
    </div>
  </main>
  <footer></footer>
</body>

</html>
